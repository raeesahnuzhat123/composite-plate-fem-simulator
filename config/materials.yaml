Isotropic_Aluminum_6061:
  name: "Aluminum 6061-T6 (Isotropic Benchmark)"
  description: "Isotropic material benchmark for analytical verification"
  E1: 70.0e9          # Young's modulus (Pa)
  E2: 70.0e9          # Young's modulus (Pa)
  G12: 26.923e9       # Shear modulus = E / (2*(1+nu)) (Pa)
  nu12: 0.30          # Poisson's ratio
  alpha1: 23.0e-6     # Thermal expansion coefficient (1/K)
  alpha2: 23.0e-6     # Thermal expansion coefficient (1/K)
  k1: 167.0           # Thermal conductivity (W/m-K)
  k2: 167.0           # Thermal conductivity (W/m-K)
  Xt: 276.0e6         # Tensile yield strength (Pa)
  Xc: 276.0e6         # Compressive yield strength (Pa)
  Yt: 276.0e6         # Transverse tensile strength (Pa)
  Yc: 276.0e6         # Transverse compressive strength (Pa)
  S: 160.0e6          # Shear strength (Pa)
  ply_thickness: 1.0e-3  # Nominal thickness (m)
  density: 2700.0     # kg/m^3
  specific_heat: 896.0 # J/(kg-K)
