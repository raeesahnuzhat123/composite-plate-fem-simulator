# Material Properties Database (All values in SI units)
# Units:
# Moduli and Strengths: Pa
# Poisson's ratio: dimensionless
# CTE: 1/K
# Thermal Conductivity: W/(m*K)
# Density: kg/m^3
# Specific Heat: J/(kg*K)
# Thickness: m

T300_5208_Carbon_Epoxy:
  name: "T300/5208 Carbon/Epoxy"
  description: "Standard high-modulus aerospace carbon/epoxy composite lamina"
  E1: 181.0e9         # Longitudinal Young's modulus (Pa)
  E2: 10.3e9          # Transverse Young's modulus (Pa)
  G12: 7.17e9         # In-plane shear modulus (Pa)
  nu12: 0.28          # Major Poisson's ratio
  alpha1: 0.02e-6     # Longitudinal thermal expansion coefficient (1/K)
  alpha2: 22.5e-6     # Transverse thermal expansion coefficient (1/K)
  k1: 5.0             # Longitudinal thermal conductivity (W/m-K)
  k2: 0.5             # Transverse thermal conductivity (W/m-K)
  Xt: 1500.0e6        # Longitudinal tensile strength (Pa)
  Xc: 1500.0e6        # Longitudinal compressive strength (Pa)
  Yt: 40.0e6          # Transverse tensile strength (Pa)
  Yc: 246.0e6         # Transverse compressive strength (Pa)
  S: 68.0e6           # In-plane shear strength (Pa)
  ply_thickness: 0.125e-3  # Nominal single ply thickness (m)
  density: 1580.0     # kg/m^3
  specific_heat: 900.0 # J/(kg-K)

